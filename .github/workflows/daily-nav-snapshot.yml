name: Daily NAV snapshot

on:
  schedule:
    # 12:35 UTC = 18:05 IST, after market close -- portfolio NAVs + index benchmarks
    - cron: "35 12 * * 1-5"
    # 17:00 UTC = 22:30 IST -- AMFI/mfapi.in mutual fund NAVs (e.g. MOSL) publish
    # late at night and aren't out yet at 18:05 IST, so re-fetch benchmarks only
    - cron: "0 17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule == '35 12 * * 1-5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot-nav.mjs
      - run: node scripts/snapshot-benchmarks.mjs
        continue-on-error: true
      - run: |
          git config user.name "nav-snapshot-bot"
          git config user.email "actions@github.com"
          git add data/nav-history-mom10.json data/nav-history-mom20.json data/nav-history-star-rsi-sharpe.json data/benchmarks.json
          git diff --cached --quiet && echo "No change" || git commit -m "Daily NAV snapshot $(date -u +%F)"
          git push

  late-benchmark-snapshot:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 17 * * 1-5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot-benchmarks.mjs
      - run: |
          git config user.name "nav-snapshot-bot"
          git config user.email "actions@github.com"
          git add data/benchmarks.json
          git diff --cached --quiet && echo "No change" || git commit -m "Late benchmark snapshot (MOSL NAV) $(date -u +%F)"
          git push
